# Collects code coverage with the built-in Microsoft Code Coverage collector,
# publishes an HTML report artifact, a job summary and a sticky PR comment.
# Optionally uploads to Codecov when the CODECOV_TOKEN repository secret is set.

name: Code Coverage

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky coverage comment
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Test with coverage
      run: >
        dotnet test Blow.AI.Mind.Tests/Blow.AI.Mind.Tests.csproj
        --configuration Release
        --settings coverage.runsettings
        --collect "Code Coverage"
        --results-directory coverage

    - name: Generate report
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: coverage/**/*.cobertura.xml
        targetdir: coverage-report
        reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub;Badges
        title: Blow.AI.Mind

    - name: Add job summary
      run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: coverage
        path: coverage-report/SummaryGithub.md

    - name: Upload to Codecov
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@v7
      with:
        token: ${{ env.CODECOV_TOKEN }}
        files: coverage-report/Cobertura.xml
        fail_ci_if_error: false
