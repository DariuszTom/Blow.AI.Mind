# Publishes Blow.AI.Mind and Blow.AI.Mind.Cli to NuGet.org when a version tag (e.g. v1.2.3) is pushed.
# The package version is calculated by MinVer from the tag (MinVerTagPrefix = v).
# Uses NuGet.org Trusted Publishing (OIDC): requires a Trusted Publishing policy on nuget.org for
# DariuszTom/Blow.AI.Mind with workflow file release.yml, and the repository secret NUGET_USER
# (nuget.org profile name, not e-mail).

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub release
  id-token: write # needed for NuGet Trusted Publishing (OIDC)

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore Blow.AI.Mind.slnx

    - name: Build
      run: dotnet build Blow.AI.Mind.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test Blow.AI.Mind.Tests/Blow.AI.Mind.Tests.csproj --configuration Release --no-build

    - name: Pack
      run: |
        dotnet pack Blow.AI.Mind/Blow.AI.Mind.csproj --configuration Release --no-build --output artifacts
        dotnet pack Blow.AI.Mind.Cli/Blow.AI.Mind.Cli.csproj --configuration Release --no-build --output artifacts

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: artifacts/*

    - name: NuGet login (OIDC → temporary API key)
      if: startsWith(github.ref, 'refs/tags/v')
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet.org
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
