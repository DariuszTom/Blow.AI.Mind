name: Feature request
description: Suggest a new template, generator, option or CLI command
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to test or achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? An API or CLI sketch is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself.
